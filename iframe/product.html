<!DOCTYPE html>
<html lang="id">
     <head>
          <title> . : : Katalog Produk Second Story Thrift : : .</title>
     </head>
     <body> 

         <h1 align="center">Produk Kami</h1>
         <table border="1" align="center">
         <tr>
         <td align="center">
         <img src="vintageshirt.jpg" width="231" height="217"><br>
         <b>Vintage Shirt Rp45.000</b>
         </td>
         <td align="center">
         <img src="denimjacket.jpg" width="231" height="217"><br>
         <b>Denim Jacket Rp85.000</b>
         </td>
         </tr>
         <tr>
        <td align="center">
        <img src="oversizedhoodie.jpg" width="231" height="217"><br>
        <b>Oversized Hoodie Rp70.000</b>
         </td>
       <td align="center">
       <img src="knitsweater.jpg" width="231" height="217"><br>
       <b>Knit Sweater Rp60.000</b>
         </td>
        </tr>
        </table>

        <br>

        <! - - Form berjejer ke samping - - >
        <form action="#" method="get" align="center">

           <! - - Jumlah - - >
           <label for="angka">Jumlah Produk :</label>
           <input type="number" id="angka" name="angka" min="1" max="10" step="1"
value="5">

          &nbsp ;&nbsp ;

         <! -- Produk -->
         <label for="produk">Produk :</label>
         <select id="produk" name="produk">
                <option value="Vintage Shirt">Vintage Shirt</option>
                <option value="Denim Jacket">Denim Jacket</option>
                <option value="Oversized Hoodie">Oversized Hoodie</option>
                <option value="Knit Sweater">Knit Sweater</option>
          </select>

        &nbsp;&nbsp;

        <! -- Ukuran -->
        <label>Pilih size:</label>

        <input type="radio" id="small" name="size" value="s">
        <label for="small">Small</label>
         
        <input type="radio" id="medium" name="size" value="m">
        <label for="medium">Medium</label>

        <input type="radio" id="large" name="size" value="l">
        <label for="large">Large</label> 
 
       &nbsp;&nbsp;

       <!-- Tombol Kirim -->
       <button type="submit">Kirim</button>

  </form>

</body>
</html>
